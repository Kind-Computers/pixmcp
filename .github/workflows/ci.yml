name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      strict_benchmark:
        description: Fail on limited or skipped benchmark tasks as well as actual failures
        type: boolean
        default: false

jobs:
  harness:
    name: Smoke harness and scenarios (no PIX needed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test the stdio MCP client used by the smoke scenarios
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Validate scenario files
        run: python -c "import glob, json; [json.load(open(p, encoding='utf-8')) for p in glob.glob('scripts/scenarios/*.json')]; print('scenarios ok')"

  # The server, its unit tests and the smoke scenarios need the PIX Preview API, a D3D12 GPU and
  # Windows Developer Mode, none of which hosted runners have. Register a self-hosted Windows runner
  # with PIX Preview (newer than 2606.15) installed and the labels below, then run this job on demand.
  pix:
    name: Build, test and smoke (self-hosted runner with PIX Preview)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, pix]
    concurrency:
      group: pix-gpu-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: dotnet build pixmcp.sln -c Release
      - run: dotnet test pixmcp.sln -c Release --no-build --logger "trx;LogFileName=unit-tests.trx"
      - name: Build the D3D12 test app (needs Visual Studio C++ tools)
        run: cmd /c tests\D3D12TestApp\build.cmd
      - name: Generate GPU and symbol-resolved timing fixtures serially
        run: python scripts/capture_fixtures.py src/PixMcp/bin/x64/Release/net10.0-windows10.0.26100.0/PixMcp.exe
      - name: Run capture and timing integration tests without overlapping GPU work
        env:
          PIX_TEST_CAPTURE: ${{ github.workspace }}\tests\artifacts\baseline.wpix
          PIX_TEST_ANALYSIS: "1"
          PIX_TEST_TIMING_CAPTURE: ${{ github.workspace }}\tests\artifacts\timing.wpix
        run: dotnet test pixmcp.sln -c Release --no-build --logger "trx;LogFileName=capture-tests.trx" -- xUnit.ParallelizeTestCollections=false
      - name: Benchmark investigations and preserve partial failures
        if: success() || failure()
        env:
          STRICT_BENCHMARK: ${{ inputs.strict_benchmark }}
        shell: pwsh
        run: |
          $benchmarkArguments = @('scripts/benchmark.py', 'src/PixMcp/bin/x64/Release/net10.0-windows10.0.26100.0/PixMcp.exe', '--capture', 'tests/artifacts/baseline.wpix', '--candidate', 'tests/artifacts/candidate.wpix')
          if ($env:STRICT_BENCHMARK -eq 'true') { $benchmarkArguments += '--strict' }
          python @benchmarkArguments
          exit $LASTEXITCODE
      - name: Upload captures, PDBs, test results, and partial investigation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pix-validation
          path: |
            tests/artifacts/
            tests/D3D12TestApp/bin/*.pdb
            **/TestResults/*.trx
